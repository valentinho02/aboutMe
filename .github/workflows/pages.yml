name: Refresh Velog and deploy portfolio
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect all public Velog posts
        run: python3 scripts/sync_posts.py
      - name: Prepare public files
        run: |
          mkdir -p _site/data
          cp index.html app.js style.css favicon.svg _site/
          cp data/posts.json data/posts-meta.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy refreshed portfolio
        id: deployment
        uses: actions/deploy-pages@v4
